<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D1A"/>
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#818CF8"/>
      <stop offset="80%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
    </filter>

    <filter id="node-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1); opacity: 0.3; }
        50% { transform: scale(1.18); opacity: 0.55; }
      }
      @keyframes pulseLine {
        0%, 100% { stroke-dashoffset: 0; opacity: 0.2; }
        50% { stroke-dashoffset: 40; opacity: 0.6; }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
        50% { transform: translateY(-12px) translateX(8px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      }
      @keyframes glowNode {
        0%, 100% { r: 4px; opacity: 0.5; }
        50% { r: 6.5px; opacity: 1; }
      }
      .anim-orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 180px; }
      .anim-orb-2 { animation: pulseOrb 10s ease-in-out infinite alternate; transform-origin: 1000px 180px; }
      .anim-dash { stroke-dasharray: 8 12; animation: pulseLine 6s linear infinite; }
      .particle-1 { animation: floatParticle 5s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 7s ease-in-out infinite reverse; }
      .particle-3 { animation: floatParticle 6s ease-in-out infinite 1s; }
      .node-pulse { animation: glowNode 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)"/>

  <!-- Subtle Circuit / Interoperability Grid Lines -->
  <g stroke="#334155" stroke-opacity="0.18" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="250" y1="0" x2="250" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="950" y1="0" x2="950" y2="360" />
    <line x1="1100" y1="0" x2="1100" y2="360" />
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Dynamic Animated Glow Orbs in Background -->
  <circle cx="200" cy="160" r="130" fill="url(#glow-grad)" filter="url(#blur-glow)" class="anim-orb-1"/>
  <circle cx="1020" cy="180" r="140" fill="url(#glow-grad)" filter="url(#blur-glow)" class="anim-orb-2"/>

  <!-- Dynamic Data Flow Lines -->
  <g fill="none">
    <path d="M 50 120 C 180 80, 220 200, 380 140" stroke="#38BDF8" stroke-width="1.8" class="anim-dash"/>
    <path d="M 820 220 C 940 260, 990 130, 1150 170" stroke="#A855F7" stroke-width="1.8" class="anim-dash"/>
    <path d="M 120 260 C 260 290, 320 240, 450 270" stroke="#818CF8" stroke-width="1.2" stroke-dasharray="6 8" class="anim-dash"/>
    <path d="M 750 90 C 880 70, 960 110, 1080 80" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="6 8" class="anim-dash"/>
  </g>

  <!-- Animated Neural & Silicon Network Nodes -->
  <g class="particle-1">
    <circle cx="160" cy="95" r="4" fill="#38BDF8" filter="url(#node-glow)" class="node-pulse"/>
    <circle cx="280" cy="180" r="5" fill="#818CF8" filter="url(#node-glow)"/>
    <circle cx="210" cy="250" r="3.5" fill="#C084FC" filter="url(#node-glow)"/>
  </g>
  <g class="particle-2">
    <circle cx="940" cy="110" r="5" fill="#C084FC" filter="url(#node-glow)" class="node-pulse"/>
    <circle cx="1050" cy="200" r="4.5" fill="#38BDF8" filter="url(#node-glow)"/>
    <circle cx="980" cy="270" r="3.5" fill="#818CF8" filter="url(#node-glow)"/>
  </g>
  <g class="particle-3">
    <circle cx="80" cy="210" r="3" fill="#38BDF8"/>
    <circle cx="1120" cy="130" r="3.5" fill="#F472B6"/>
  </g>

  <!-- Foreground Content Container -->
  <g id="foreground">
    <!-- Top Micro Tag Pill -->
    <g transform="translate(425, 42)">
      <rect width="350" height="30" rx="15" fill="url(#pill-grad)" stroke="#6366F1" stroke-width="1" stroke-opacity="0.6"/>
      <text x="175" y="20" fill="#E0E7FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">
        ⚡ OPEN ECOSYSTEM &amp; STANDARDS ⚡
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" fill="url(#title-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5" text-anchor="middle">
      ML Interoperability &amp; Standards
    </text>

    <!-- Subtitle -->
    <text x="600" y="195" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="0.2" text-anchor="middle">
      Universal Model Formats • Cross-Framework Compilation • Heterogeneous Hardware Acceleration
    </text>

    <!-- Feature Chips / Badges Row -->
    <g transform="translate(195, 240)">
      <!-- ONNX -->
      <g transform="translate(0, 0)">
        <rect width="115" height="42" rx="8" fill="url(#card-grad)" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.5"/>
        <text x="57" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" text-anchor="middle">📦 ONNX</text>
      </g>

      <!-- GGUF -->
      <g transform="translate(130, 0)">
        <rect width="115" height="42" rx="8" fill="url(#card-grad)" stroke="#818CF8" stroke-width="1.2" stroke-opacity="0.5"/>
        <text x="57" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" text-anchor="middle">🧠 GGUF</text>
      </g>

      <!-- TensorRT -->
      <g transform="translate(260, 0)">
        <rect width="130" height="42" rx="8" fill="url(#card-grad)" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.5"/>
        <text x="65" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" text-anchor="middle">⚡ TensorRT</text>
      </g>

      <!-- OpenVINO -->
      <g transform="translate(405, 0)">
        <rect width="130" height="42" rx="8" fill="url(#card-grad)" stroke="#0284C7" stroke-width="1.2" stroke-opacity="0.5"/>
        <text x="65" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" text-anchor="middle">🔷 OpenVINO</text>
      </g>

      <!-- Core ML -->
      <g transform="translate(550, 0)">
        <rect width="125" height="42" rx="8" fill="url(#card-grad)" stroke="#E11D48" stroke-width="1.2" stroke-opacity="0.5"/>
        <text x="62" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" text-anchor="middle">🍏 Core ML</text>
      </g>

      <!-- Apache TVM -->
      <g transform="translate(690, 0)">
        <rect width="120" height="42" rx="8" fill="url(#card-grad)" stroke="#A855F7" stroke-width="1.2" stroke-opacity="0.5"/>
        <text x="60" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" text-anchor="middle">🛠️ TVM</text>
      </g>
    </g>

    <!-- Bottom Border Accent Line -->
    <rect x="0" y="356" width="1200" height="4" rx="2" fill="url(#title-grad)"/>
  </g>
</svg>
